name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch or PR. A new push to a PR cancels its running check;
# runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Generates Next.js route types first, so it needs no build.
      - run: npm run typecheck

      # Unit tests only. They use no database or network, so CI needs no secrets.
      - run: npm test
